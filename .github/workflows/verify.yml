name: Verify actual retrieval
on:
  push:
    branches: [build/tracepath, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:b9f6b8ff03b62f3cfd9d9ba3fe56226a9991c79d3fb46fd46536263bf02be553
        env:
          POSTGRES_DB: tracepath
          POSTGRES_USER: tracepath
          POSTGRES_PASSWORD: ci-disposable-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tracepath"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://tracepath:ci-disposable-password@127.0.0.1:5432/tracepath
      OWNER_DATABASE_URL: postgresql://tracepath:ci-disposable-password@127.0.0.1:5432/tracepath
      TEST_DATABASE_URL: postgresql://tracepath:ci-disposable-password@127.0.0.1:5432/tracepath
      COLLECTOR_BINARY: /tmp/tracepath-collector/otelcol-contrib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install exact dependencies
        run: python -m pip install -r requirements.lock
      - name: Prepare dedicated database
        run: python -m scripts.migrate
      - name: Verify checked-in study hashes and derivation
        run: python -m scripts.verify_evidence
      - name: Run contract and integration tests
        run: python -m pytest -q
      - name: Check Python quality
        run: python -m ruff check packages evaluation/independent_grader scripts tests
      - name: Scan retained source and evidence
        run: python -m scripts.scan_artifacts
      - name: Validate palette
        run: python scripts/validators/palette_validator.py palette.json
      - name: Download pinned model
        run: python -m scripts.prepare_model
      - name: Compare two model calls with direct ONNX inference
        run: python -m scripts.probe_model
      - name: Prepare verified Collector
        run: python -m scripts.prepare_collector
      - name: Execute full Linux inventory
        run: python -m scripts.run_study
      - name: Independently grade Linux evidence
        run: python -m scripts.grade_latest
      - name: Verify process-death recovery and context isolation
        run: python -m scripts.check_recovery
      - name: Export independently accepted web data
        run: python -m scripts.export_web
      - name: Build typed frontend
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verified-evidence-${{ github.sha }}
          path: |
            artifacts/raw
            artifacts/accepted
            artifacts/manifests
            web/dist
          retention-days: 14
