[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracepath-workbench"
version = "0.1.0"
description = "Independent retrieval trace and receipt reconciliation"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.7", "uvicorn==0.54.0", "httpx==0.28.1", "psycopg[binary]==3.3.9", "rank-bm25==0.2.2", "opentelemetry-sdk==1.45.2", "opentelemetry-exporter-otlp-proto-http==1.45.2"]

[project.optional-dependencies]
ml = ["fastembed==0.9.1"]
dev = ["pytest==9.2.0", "psutil", "ruff"]

[tool.setuptools.packages.find]
include = ["packages*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires real processes and a disposable Postgres database", "model: requires pinned model bytes"]

[tool.ruff]
line-length = 100
target-version = "py312"
